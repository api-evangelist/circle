description: >-
  Circle Internet Financial is the issuer of USDC and EURC and operates a developer platform for moving regulated
  stablecoin money across the internet. Their APIs cover programmable wallets (developer- and user-controlled), gas
  sponsorship, the Cross-Chain Transfer Protocol (CCTP), Gateway unified balances, the Smart Contract Platform, the
  Circle Payments Network (CPN) for cross-border payments, compliance, StableFX trading on Arc, and xReserve for issuing
  USDC-backed stablecoins.
